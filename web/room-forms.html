      <div class="shell landing-grid">
        <section class="card entry-card" id="create" aria-labelledby="create-title">
          <span class="form-tape" data-stamp aria-hidden="true"></span>
          <div class="card-heading"><span class="tile-icon accent" data-icon="plus"></span><div><h2 id="create-title">Create a room</h2><p>Give your team a place to share.</p></div></div>
          <form id="create-form">
            <label for="room-name">Room name <span>Optional</span></label>
            <input id="room-name" type="text" maxlength="60" placeholder="e.g. Design team" autocomplete="off">
            <label for="room-code">Room code <span>Optional</span></label>
            <input id="room-code" class="mono-input" type="text" maxlength="24" placeholder="e.g. DESIGN-TEAM" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="room-help">
            <p class="field-hint" id="room-help">Choose a permanent code or leave it blank to generate one.</p>
            <p class="message" id="create-message" role="status" hidden></p>
            <button type="submit" class="button primary full" id="create-button"><span data-icon="plus"></span> Create room</button>
          </form>
        </section>
        <section class="card entry-card" id="join" aria-labelledby="join-title">
          <span class="form-tape" data-stamp aria-hidden="true"></span>
          <div class="card-heading"><span class="tile-icon plain" data-icon="enter"></span><div><h2 id="join-title">Join a room</h2><p>Open a room your teammate shared.</p></div></div>
          <form id="join-form">
            <label for="join-code">Code or share link</label>
            <div class="with-paste"><input id="join-code" class="mono-input" type="text" placeholder="e.g. DESIGN-TEAM" autocomplete="off" autocapitalize="characters" spellcheck="false"><button type="button" id="paste-code" class="icon-button" aria-label="Paste room code" data-icon="clipboard"></button></div>
            <p class="message" id="join-message" role="status" hidden></p>
            <button type="submit" class="button secondary solid full" id="join-button"><span data-icon="enter"></span> Join room</button>
          </form>
          <section id="recent" class="recent" aria-labelledby="recent-title" hidden>
            <div class="recent-heading">
              <h3 id="recent-title">Recent rooms</h3>
              <button type="button" class="btn btn-sm secondary" id="clear-recent">Clear history</button>
            </div>
            <ul id="recent-list"></ul>
          </section>
        </section>
      </div>
